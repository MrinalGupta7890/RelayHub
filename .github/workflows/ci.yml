name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (api, worker)
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

  # Integration job intentionally omitted until Phase 2 (database layer)
  # introduces code that actually talks to Postgres/Redis — a job that
  # spins up service containers to test nothing would be a no-op wasting
  # CI minutes and would need to be rewritten immediately anyway.
